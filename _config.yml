# Site wide configuration
title: Eugene Belilovsky
locale: en_US

# Important for links, feeds, and some themes:
url: https://eugenium.github.io
baseurl: ""   # user/organization sites should keep this empty

# Theme settings
minimal_mistakes_skin: "air"

# Jekyll config
permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

# Remove legacy 'gems:' block entirely
# gems:
#   - jekyll-sitemap

# Plugins (formerly 'gems:')
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Site owner (unchanged)
owner:
  name: Eugene Belilovsky
  bio: "Researcher in Machine Learning"
  email: Belilovsky.Eugene@gmail.com
  avatar: hi.jpeg

include:
  - _pages
exclude:
  - lib
  - config.rb
  - Capfile
  - config
  - log
  - Rakefile
  - Rakefile.rb
  - tmp
  - less
  - "*.sublime-project"
  - "*.sublime-workspace"
  - test
  - spec
  - Gruntfile.js
  - package.json
  - node_modules
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
